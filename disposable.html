<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kamera Sekali Pakai</title>
<style>
:root{--bg:#1b1a17;--ink:#f2ead8;--dim:#9a917d;--accent:#f0b429;--body:#2a2824}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.screen{display:none;flex:1;flex-direction:column;padding:20px}
.screen.on{display:flex}
#welcome{justify-content:center;gap:16px;max-width:420px;margin:0 auto;width:100%}
h1{font-family:Georgia,serif;font-size:2rem;margin:0;line-height:1.1}
p{margin:0;color:var(--dim);line-height:1.5}
input{font:inherit;padding:14px;border-radius:8px;border:2px solid var(--dim);background:var(--body);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{font:inherit;font-weight:700;padding:14px;border:0;border-radius:8px;background:var(--accent);color:#1b1a17}
#cam{padding:0;background:#000}
.finder{position:relative;flex:1;overflow:hidden}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bar{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;background:var(--body)}
.count{font-family:"Courier New",monospace;font-size:2.2rem;color:var(--accent);min-width:3ch}
.count small{display:block;font-size:.7rem;color:var(--dim)}
.shutter{width:76px;height:76px;border-radius:50%;border:6px solid var(--ink);background:var(--accent);transition:transform .08s}
.shutter:active{transform:scale(.92)}
.shutter:disabled{background:var(--dim);opacity:.5}
.status{font-size:.8rem;color:var(--dim);min-width:6ch;text-align:right}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:fl .18s}
@keyframes fl{from{opacity:.9}to{opacity:0}}
@media (prefers-reduced-motion:reduce){.flash.go{animation:none}}
#done{justify-content:center;text-align:center;gap:12px}
</style>
</head>
<body>

<section class="screen on" id="welcome">
  <h1>Kamera sekali pakai</h1>
  <p>Kamu punya <span id="maxLabel"></span> jepretan. Tidak ada pratinjau, jadi hasilnya kejutan. Semua foto langsung masuk ke album acara.</p>
  <input id="name" placeholder="Nama kamu" autocomplete="name" maxlength="30">
  <button class="btn" id="start">Mulai memotret</button>
  <p id="err" role="alert"></p>
</section>

<section class="screen" id="cam">
  <div class="finder"><video id="v" playsinline muted autoplay></video><div class="flash" id="fl"></div></div>
  <div class="bar">
    <div class="count"><span id="left">24</span><small>sisa foto</small></div>
    <button class="shutter" id="shot" aria-label="Ambil foto"></button>
    <div class="status" id="status"></div>
  </div>
</section>

<section class="screen" id="done">
  <h1>Film habis</h1>
  <p>Terima kasih, <span id="who"></span>! Foto kamu sedang dikirim ke album acara. Tunggu sampai semuanya terkirim sebelum menutup halaman ini.</p>
  <p id="pending"></p>
</section>

<script>
// ====== PENGATURAN ======
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxUuopoumlDQ2vT3uqQvDXiEnIywcxyMkb7YxYsv6mfToObC-KF2lFIkFBENywSxx9-/exec';
const MAX_SHOTS = 24;
// ========================

const $ = id => document.getElementById(id);
const store = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }
};
let name = store.get('dc_name') || '';
let taken = parseInt(store.get('dc_taken') || '0', 10);
let queue = [], sending = false, stream;

$('maxLabel').textContent = MAX_SHOTS;
$('name').value = name;
if (taken >= MAX_SHOTS) show('done'), $('who').textContent = name || 'teman';

function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
}
function updateUI(){
  $('left').textContent = Math.max(MAX_SHOTS - taken, 0);
  $('shot').disabled = taken >= MAX_SHOTS;
  const n = queue.length + (sending ? 1 : 0);
  $('status').textContent = n ? 'kirim ' + n : '';
  $('pending').textContent = n ? n + ' foto masih dikirim…' : (taken >= MAX_SHOTS ? 'Semua foto sudah terkirim.' : '');
}

$('start').onclick = async () => {
  name = $('name').value.trim();
  if (!name) { $('err').textContent = 'Isi nama dulu supaya foto mudah dikenali.'; return; }
  store.set('dc_name', name);
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1600 } }, audio: false });
  } catch (e) {
    $('err').textContent = 'Kamera tidak bisa dibuka. Izinkan akses kamera di browser, lalu coba lagi.';
    return;
  }
  $('v').srcObject = stream;
  show(taken >= MAX_SHOTS ? 'done' : 'cam');
  $('who').textContent = name;
  updateUI();
};

$('shot').onclick = () => {
  if (taken >= MAX_SHOTS) return;
  const v = $('v');
  if (!v.videoWidth) return;
  const scale = Math.min(1, 1600 / Math.max(v.videoWidth, v.videoHeight));
  const c = document.createElement('canvas');
  c.width = v.videoWidth * scale; c.height = v.videoHeight * scale;
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
  taken++;
  store.set('dc_taken', taken);
  queue.push({ name, n: taken, image: c.toDataURL('image/jpeg', 0.8) });
  const f = $('fl'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
  if (navigator.vibrate) navigator.vibrate(30);
  updateUI(); flush();
  if (taken >= MAX_SHOTS) setTimeout(() => { show('done'); updateUI(); }, 400);
};

async function flush(){
  if (sending) return;
  sending = true;
  while (queue.length) {
    const item = queue[0];
    try {
      await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(item) });
      queue.shift();
    } catch (e) {
      await new Promise(r => setTimeout(r, 4000)); // koneksi putus, coba lagi
    }
    updateUI();
  }
  sending = false;
  updateUI();
}
window.addEventListener('beforeunload', e => { if (queue.length || sending) { e.preventDefault(); e.returnValue = ''; } });
</script>
</body>
</html>
